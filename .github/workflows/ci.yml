# Prüfung für die wöchentliche Realprobe von szyOS: Erst mit grüner CI darf der Autopilot abnehmen und mergen.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test
